services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: llm
      RABBITMQ_DEFAULT_PASS: llm-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=llm_tutor_auth;Username=postgres;Password=postgres;
    ports:
      - "5210:8080"
    depends_on:
      postgres:
        condition: service_healthy

  teaching-service:
    build:
      context: .
      dockerfile: TeachingService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=llm_tutor_teaching;Username=postgres;Password=postgres;
    ports:
      - "5212:8080"
    depends_on:
      postgres:
        condition: service_healthy

  llm-gateway:
    build:
      context: .
      dockerfile: LLMGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=llm_gateway;Username=postgres;Password=postgres;
    ports:
      - "5200:8080"
    depends_on:
      postgres:
        condition: service_healthy

  tutor-room:
    build:
      context: .
      dockerfile: LLMTutorRoom/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=llm_tutor_room;Username=postgres;Password=postgres;
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: llm
      RabbitMq__Password: llm-dev
      TeachingService__BaseUrl: http://teaching-service:8080
      ReviewProcessing__LlmGatewayBaseUrl: http://llm-gateway:8080
    ports:
      - "5206:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      teaching-service:
        condition: service_started
      llm-gateway:
        condition: service_started

  nginx:
    image: nginx:1.27
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.compose.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_started
      tutor-room:
        condition: service_started
      teaching-service:
        condition: service_started
      llm-gateway:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
