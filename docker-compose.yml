services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
      - host-access

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: llm
      RABBITMQ_DEFAULT_PASS: llm-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
      - host-access

  aspire-dashboard-data-init:
    image: alpine:3.20
    command: ["chown", "-R", "1654:1654", "/dashboard-data"]
    volumes:
      - aspire-dashboard-data:/dashboard-data
    restart: "no"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      ASPIRE_DASHBOARD_APPLICATION_NAME: LLMTutorRoom
      ASPIRE_DASHBOARD_DATA_DIRECTORY: /dashboard-data
      ASPIRE_DASHBOARD_PERSISTENCE_MODE: Resume
    ports:
      - "18888:18888"
      - "4317:18889"
      - "4318:18890"
    volumes:
      - aspire-dashboard-data:/dashboard-data
    depends_on:
      aspire-dashboard-data-init:
        condition: service_completed_successfully
    networks:
      - edge
      - backend

  auth-service:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__DefaultConnection: Host=postgres;Database=llm_tutor_auth;Username=postgres;Password=postgres;
    ports:
      - "5210:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - backend

  group-service:
    build:
      context: .
      dockerfile: GroupService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__DefaultConnection: Host=postgres;Database=llm_tutor_groups;Username=postgres;Password=postgres;
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - backend

  teaching-service:
    build:
      context: .
      dockerfile: TeachingService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__DefaultConnection: Host=postgres;Database=llm_tutor_teaching;Username=postgres;Password=postgres;
      GroupService__BaseUrl: http://group-service:8080
      IntegrationEvents__HostName: rabbitmq
      IntegrationEvents__Port: 5672
      IntegrationEvents__UserName: llm
      IntegrationEvents__Password: llm-dev
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      group-service:
        condition: service_started
    networks:
      - edge
      - backend

  attempt-service:
    build:
      context: .
      dockerfile: AttemptService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__DefaultConnection: Host=postgres;Database=llm_tutor_attempts;Username=postgres;Password=postgres;
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: llm
      RabbitMq__Password: llm-dev
      TeachingService__BaseUrl: http://teaching-service:8080
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      teaching-service:
        condition: service_started
    networks:
      - edge
      - backend

  llm-gateway:
    build:
      context: .
      dockerfile: LLMGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__DefaultConnection: Host=postgres;Database=llm_gateway;Username=postgres;Password=postgres;
    ports:
      - "5200:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - backend

  review-service:
    build:
      context: .
      dockerfile: ReviewService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__DefaultConnection: Host=postgres;Database=llm_tutor_reviews;Username=postgres;Password=postgres;
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: llm
      RabbitMq__Password: llm-dev
      ReviewProcessing__LlmGatewayBaseUrl: http://llm-gateway:8080
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      llm-gateway:
        condition: service_started
    networks:
      - edge
      - backend

  tutor-room:
    build:
      context: .
      dockerfile: LLMTutorRoom/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      AttemptService__BaseUrl: http://attempt-service:8080
      TeachingService__BaseUrl: http://teaching-service:8080
      ReviewService__BaseUrl: http://review-service:8080
      GroupService__BaseUrl: http://group-service:8080
    expose:
      - "8080"
    depends_on:
      attempt-service:
        condition: service_healthy
      teaching-service:
        condition: service_started
      review-service:
        condition: service_healthy
      group-service:
        condition: service_started
    networks:
      - edge
      - backend

  nginx:
    image: nginx:1.27
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.compose.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_started
      group-service:
        condition: service_started
      tutor-room:
        condition: service_started
      attempt-service:
        condition: service_started
      teaching-service:
        condition: service_started
      llm-gateway:
        condition: service_started
      review-service:
        condition: service_healthy
    networks:
      - edge

volumes:
  postgres-data:
  rabbitmq-data:
  aspire-dashboard-data:

networks:
  edge:
  host-access:
  backend:
    internal: true
