events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream auth_service {
        zone auth_service 64k;
        server auth-service:8080 resolve;
    }

    upstream attempt_service {
        zone attempt_service 64k;
        server attempt-service:8080 resolve;
    }

    upstream tutor_room {
        zone tutor_room 64k;
        server tutor-room:8080 resolve;
    }

    upstream teaching_service {
        zone teaching_service 64k;
        server teaching-service:8080 resolve;
    }

    upstream llm_gateway {
        zone llm_gateway 64k;
        server llm-gateway:8080 resolve;
    }

    server {
        listen 8080;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        location = /internal {
            return 404;
        }

        location ^~ /internal/ {
            return 404;
        }

        location /api/auth/ {
            proxy_pass http://auth_service;
        }

        location = /api/attempts {
            proxy_pass http://attempt_service;
        }

        location /api/attempts/ {
            proxy_pass http://attempt_service;
        }

        location /api/users/ {
            proxy_pass http://auth_service;
        }

        location /api/classroom/ {
            proxy_pass http://tutor_room;
        }

        location /api/teaching/ {
            proxy_pass http://teaching_service;
        }

        location /api/llm/ {
            rewrite ^/api/llm/(.*)$ /api/$1 break;
            proxy_pass http://llm_gateway;
        }

        location / {
            proxy_pass http://tutor_room;
        }
    }
}
