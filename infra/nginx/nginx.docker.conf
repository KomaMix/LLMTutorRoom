events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server host.docker.internal:5210;
    }

    upstream attempt_service {
        server host.docker.internal:5216;
    }

    upstream tutor_room {
        server host.docker.internal:5206;
    }

    upstream teaching_service {
        server host.docker.internal:5212;
    }

    upstream llm_gateway {
        server host.docker.internal:5200;
    }

    upstream review_service {
        server host.docker.internal:5214;
    }

    server {
        listen 8080;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        location = /internal {
            return 404;
        }

        location ^~ /internal/ {
            return 404;
        }

        location /api/auth/ {
            proxy_pass http://auth_service;
        }

        location = /api/attempts {
            proxy_pass http://attempt_service;
        }

        location /api/attempts/ {
            proxy_pass http://attempt_service;
        }

        location /api/users/ {
            proxy_pass http://auth_service;
        }

        location /api/classroom/ {
            proxy_pass http://tutor_room;
        }

        location /api/teaching/ {
            proxy_pass http://teaching_service;
        }

        location /api/llm/ {
            rewrite ^/api/llm/(.*)$ /api/$1 break;
            proxy_pass http://llm_gateway;
        }

        location /api/reviews/ {
            proxy_pass http://review_service;
        }

        location /api/model-access/ {
            proxy_pass http://review_service;
        }

        location / {
            proxy_pass http://tutor_room;
        }
    }
}
