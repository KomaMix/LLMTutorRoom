events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server 127.0.0.1:5210;
    }

    upstream tutor_room {
        server 127.0.0.1:5206;
    }

    upstream teaching_service {
        server 127.0.0.1:5212;
    }

    upstream llm_gateway {
        server 127.0.0.1:5200;
    }

    server {
        listen 8080;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        location /api/auth/ {
            proxy_pass http://auth_service;
        }

        location /api/users/ {
            proxy_pass http://auth_service;
        }

        location /api/classroom/ {
            proxy_pass http://tutor_room;
        }

        location /api/teaching/ {
            proxy_pass http://teaching_service;
        }

        location /api/llm/ {
            rewrite ^/api/llm/(.*)$ /api/$1 break;
            proxy_pass http://llm_gateway;
        }

        location / {
            proxy_pass http://tutor_room;
        }
    }
}
